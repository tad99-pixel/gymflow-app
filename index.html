                  className={`p-2 rounded-lg transition-colors ${view === 'info' ? 'bg-red-500 text-white' : 'text-zinc-400 hover:text-white hover:bg-zinc-800'}`}
                >
                  <i data-lucide="info" className="w-5 h-5"></i>
                </button>
              </div>
            </div>
          </header>

          <main className="max-w-4xl mx-auto px-4 pb-24">
            {view === 'home' && !selectedExercise && (
              <div className="pt-8 space-y-8">
                <div className="text-center space-y-3">
                  <h2 className="text-5xl font-bold tracking-tight" style={{ fontFamily: 'Bebas Neue, Impact, sans-serif' }}>
                    BUILD YOUR<br/>WORKOUT
                  </h2>
                  <p className="text-zinc-400 text-lg max-w-md mx-auto">
                    Select muscle groups to get personalized exercise recommendations with detailed instructions
                  </p>
                </div>

                <div className="space-y-4">
                  <div className="flex items-center justify-between">
                    <h3 className="text-xl font-bold tracking-wide" style={{ fontFamily: 'Bebas Neue, Impact, sans-serif' }}>
                      SELECT MUSCLES
                    </h3>
                    {selectedMuscles.length > 0 && (
                      <button
                        onClick={() => setSelectedMuscles([])}
                        className="text-sm text-zinc-400 hover:text-white transition-colors"
                      >
                        Clear all
                      </button>
                    )}
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    {MUSCLE_GROUPS.map(muscle => (
                      <button
                        key={muscle.id}
                        onClick={() => toggleMuscle(muscle.id)}
                        className={`p-5 rounded-2xl border-2 transition-all duration-300 text-left ${
                          selectedMuscles.includes(muscle.id)
                            ? 'border-red-500 bg-red-500/10 shadow-lg shadow-red-500/20'
                            : 'border-zinc-800 bg-zinc-900/50 hover:border-zinc-700 hover:bg-zinc-900'
                        }`}
                      >
                        <div className="flex items-start gap-3">
                          <span className="text-3xl">{muscle.icon}</span>
                          <div className="flex-1">
                            <h4 className="font-bold text-lg mb-1">{muscle.name}</h4>
                            <p className="text-sm text-zinc-500">{muscle.description}</p>
                          </div>
                          {selectedMuscles.includes(muscle.id) && (
                            <i data-lucide="target" className="w-5 h-5 text-red-500 flex-shrink-0"></i>
                          )}
                        </div>
                      </button>
                    ))}
                  </div>
                </div>

                {selectedMuscles.length > 0 && (
                  <div className="fixed bottom-0 left-0 right-0 p-4 bg-gradient-to-t from-black via-black to-transparent">
                    <div className="max-w-4xl mx-auto">
                      <button
                        onClick={() => setView('exercises')}
                        className="w-full bg-red-500 hover:bg-red-600 text-white font-bold py-4 px-6 rounded-xl transition-all duration-300 shadow-lg shadow-red-500/30 hover:shadow-red-500/50 flex items-center justify-center gap-2"
                        style={{ fontFamily: 'Bebas Neue, Impact, sans-serif', letterSpacing: '1px', fontSize: '18px' }}
                      >
                        <i data-lucide="list" className="w-5 h-5"></i>
                        VIEW {getExercisesForSelectedMuscles().length} EXERCISES
                        <i data-lucide="chevron-right" className="w-5 h-5"></i>
                      </button>
                    </div>
                  </div>
                )}
              </div>
            )}

            {view === 'exercises' && !selectedExercise && (
              <div className="pt-8 space-y-6">
                <div className="flex items-center justify-between">
                  <div>
                    <h2 className="text-3xl font-bold tracking-tight" style={{ fontFamily: 'Bebas Neue, Impact, sans-serif' }}>
                      YOUR EXERCISES
                    </h2>
                    <p className="text-zinc-400 mt-1">
                      {getExercisesForSelectedMuscles().length} exercises for {selectedMuscles.join(', ')}
                    </p>
                  </div>
                  <button
                    onClick={() => setView('home')}
                    className="text-sm text-zinc-400 hover:text-white transition-colors"
                  >
                    ← Back
                  </button>
                </div>

                <div className="space-y-3">
                  {getExercisesForSelectedMuscles().map((exercise, idx) => (
                    <button
                      key={idx}
                      onClick={() => { setSelectedExercise(exercise); setView('detail'); }}
                      className="w-full bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 rounded-xl p-5 transition-all duration-300 text-left group"
                    >
                      <div className="flex items-start justify-between gap-4">
                        <div className="flex-1">
                          <h3 className="font-bold text-lg mb-2 group-hover:text-red-500 transition-colors">
                            {exercise.name}
                          </h3>
                          <div className="flex flex-wrap gap-2 mb-2">
                            <span className={`text-xs px-2 py-1 rounded-full ${getDifficultyColor(exercise.difficulty)}`}>
                              {exercise.difficulty}
                            </span>
                            <span className="text-xs px-2 py-1 rounded-full bg-zinc-800 text-zinc-300">
                              {exercise.equipment}
                            </span>
                          </div>
                          <p className="text-sm text-zinc-400">
                            {exercise.targetMuscles.join(', ')}
                          </p>
                        </div>
                        <i data-lucide="chevron-right" className="w-5 h-5 text-zinc-600 group-hover:text-red-500 transition-colors flex-shrink-0 mt-1"></i>
                      </div>
                    </button>
                  ))}
                </div>
              </div>
            )}

            {view === 'detail' && selectedExercise && (
              <div className="pt-8 pb-8 space-y-6">
                <button
                  onClick={() => { setSelectedExercise(null); setView('exercises'); }}
                  className="text-zinc-400 hover:text-white transition-colors flex items-center gap-2 mb-4"
                >
                  ← Back to exercises
                </button>

                <div className="space-y-6">
                  <div>
                    <h2 className="text-4xl font-bold mb-3 tracking-tight" style={{ fontFamily: 'Bebas Neue, Impact, sans-serif' }}>
                      {selectedExercise.name}
                    </h2>
                    <div className="flex flex-wrap gap-2 mb-4">
                      <span className={`text-sm px-3 py-1 rounded-full ${getDifficultyColor(selectedExercise.difficulty)}`}>
                        {selectedExercise.difficulty}
                      </span>
                      <span className="text-sm px-3 py-1 rounded-full bg-zinc-800 text-zinc-300">
                        {selectedExercise.equipment}
                      </span>
                    </div>
                    <p className="text-zinc-400">
                      <strong className="text-white">Target Muscles:</strong> {selectedExercise.targetMuscles.join(', ')}
                    </p>
                    <p className="text-zinc-400 mt-1">
                      <strong className="text-white">Recommended:</strong> {selectedExercise.sets}
                    </p>
                  </div>

                  <a
                    href={selectedExercise.video}
                    target="_blank"
                    rel="noopener noreferrer"
                    className="flex items-center gap-3 bg-red-500/10 border-2 border-red-500/30 rounded-xl p-4 hover:bg-red-500/20 hover:border-red-500/50 transition-all duration-300 group"
                  >
                    <i data-lucide="play-circle" className="w-6 h-6 text-red-500 group-hover:scale-110 transition-transform"></i>
                    <div className="flex-1">
                      <h4 className="font-bold text-white mb-1">Watch Video Tutorial</h4>
                      <p className="text-sm text-zinc-400">See proper form and technique</p>
                    </div>
                    <i data-lucide="chevron-right" className="w-5 h-5 text-red-500"></i>
                  </a>

                  <div className="bg-zinc-900 border border-zinc-800 rounded-xl p-6">
                    <h3 className="text-xl font-bold mb-4 tracking-wide" style={{ fontFamily: 'Bebas Neue, Impact, sans-serif' }}>
                      STEP-BY-STEP INSTRUCTIONS
                    </h3>
                    <ol className="space-y-3">
                      {selectedExercise.instructions.map((instruction, idx) => (
                        <li key={idx} className="flex gap-3">
                          <span className="flex-shrink-0 w-7 h-7 bg-red-500 text-white rounded-full flex items-center justify-center text-sm font-bold">
                            {idx + 1}
                          </span>
                          <p className="text-zinc-300 pt-0.5">{instruction}</p>
                        </li>
                      ))}
                    </ol>
                  </div>

                  <div className="bg-amber-500/5 border-2 border-amber-500/20 rounded-xl p-6">
                    <div className="flex items-center gap-2 mb-4">
                      <i data-lucide="alert-circle" className="w-5 h-5 text-amber-500"></i>
                      <h3 className="text-xl font-bold tracking-wide text-amber-500" style={{ fontFamily: 'Bebas Neue, Impact, sans-serif' }}>
                        PRO TIPS
                      </h3>
                    </div>
                    <ul className="space-y-2">
                      {selectedExercise.tips.map((tip, idx) => (
                        <li key={idx} className="flex gap-3 text-zinc-300">
                          <span className="text-amber-500 flex-shrink-0">•</span>
                          <p>{tip}</p>
                        </li>
                      ))}
                    </ul>
                  </div>
                </div>
              </div>
            )}

            {view === 'info' && (
              <div className="pt-8 space-y-6">
                <div>
                  <h2 className="text-3xl font-bold mb-2 tracking-tight" style={{ fontFamily: 'Bebas Neue, Impact, sans-serif' }}>
                    ABOUT GYMFLOW
                  </h2>
                  <p className="text-zinc-400">Your personal workout guide</p>
                </div>

                <div className="space-y-4">
                  <div className="bg-zinc-900 border border-zinc-800 rounded-xl p-6">
                    <h3 className="font-bold text-lg mb-2">How It Works</h3>
                    <ol className="space-y-2 text-zinc-400">
                      <li>1. Select the muscle groups you want to train</li>
                      <li>2. Browse through curated exercises for those muscles</li>
                      <li>3. Get detailed instructions, form tips, and video tutorials</li>
                      <li>4. Build your perfect workout routine</li>
                    </ol>
                  </div>

                  <div className="bg-zinc-900 border border-zinc-800 rounded-xl p-6">
                    <h3 className="font-bold text-lg mb-2">Features</h3>
                    <ul className="space-y-2 text-zinc-400">
                      <li>✓ Comprehensive exercise database</li>
                      <li>✓ Detailed step-by-step instructions</li>
                      <li>✓ Pro tips for perfect form</li>
                      <li>✓ Video tutorial links</li>
                      <li>✓ Difficulty levels for all fitness stages</li>
                      <li>✓ Target muscle breakdowns</li>
                    </ul>
                  </div>

                  <div className="bg-red-500/10 border-2 border-red-500/30 rounded-xl p-6">
                    <h3 className="font-bold text-lg mb-2 text-red-500">Safety First</h3>
                    <p className="text-zinc-300 mb-2">
                      Always prioritize proper form over heavy weight. If you're new to exercise, consider working with a certified personal trainer to ensure you're performing movements safely.
                    </p>
                    <p className="text-zinc-400 text-sm">
                      Consult with a healthcare professional before starting any new exercise program.
                    </p>
                  </div>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<GymApp />);
  </script>
</body>
</html>
